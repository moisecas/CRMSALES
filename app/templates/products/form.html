{% extends "partials/base.html" %}
{% block content %}
<h2>{{ "Editar" if row else "Nuevo" }} producto</h2>

<form method="post" action="{{ '/products/' ~ row.id ~ '/edit' if row else '/products/new' }}" class="row g-3">
  <div class="col-md-4">
    <label class="form-label">SKU</label>
    <input class="form-control" name="sku" value="{{ row.sku if row else '' }}" required>
  </div>

  <div class="col-md-8">
    <label class="form-label">Nombre</label>
    <input class="form-control" name="name" value="{{ row.name if row else '' }}" required>
  </div>

  <div class="col-md-6">
    <label class="form-label">Categoría (texto por ahora)</label>
    <input class="form-control" name="category" value="{{ row.category if row else '' }}">
  </div>

  <div class="col-md-3">
    <label class="form-label">Costo</label>
    <input class="form-control" name="cost" type="number" step="0.01" value="{{ row.cost if row else 0 }}">
  </div>

  <div class="col-md-3">
    <label class="form-label">Precio</label>
    <input class="form-control" name="price" type="number" step="0.01" value="{{ row.price if row else 0 }}">
  </div>

  <div class="col-md-3">
    <label class="form-label">Stock mínimo</label>
    <input class="form-control" name="stock_min" type="number" min="0" value="{{ row.stock_min if row else 0 }}">
  </div>

  {% if row is none %}
  <div class="col-md-3">
    <label class="form-label">Stock inicial</label>
    <input class="form-control" name="initial_stock" type="number" min="0" value="0">
    <div class="form-text">Se registrará como movimiento de entrada (IN) en el kardex.</div>
  </div>
  {% else %}
  <div class="col-md-3">
    <label class="form-label">Stock actual</label>
    <input class="form-control" value="{{ row.current_stock }}" disabled>
    <div class="form-text">El stock se ajusta desde Inventario (Ajuste/Ventas/Compras).</div>
  </div>
  {% endif %}

  <div class="col-md-3 d-flex align-items-end">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" name="active" {% if row is none or row.active %}checked{% endif %}>
      <label class="form-check-label">Activo</label>
    </div>
  </div>

  <div class="col-12">
    <button class="btn btn-success">Guardar</button>
    <a class="btn btn-outline-secondary" href="/products">Cancelar</a>
  </div>
</form>
{% endblock %}
