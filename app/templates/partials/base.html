<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{{ title or "Inventario Pro" }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>

<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">Inventario Pro</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain"
            aria-controls="navMain" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMain">
      {% if user %}
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" href="/dashboard">Dashboard</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="/products">Productos</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="/sales">Ventas</a>
        </li>

        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            Inventario
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="/inventory/stock">Stock</a></li>
            <li><a class="dropdown-item" href="/inventory/kardex">Kardex</a></li>
            {% if user.role in ["Admin","Bodeguero"] %}
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="/inventory/adjust">Ajuste (+/-)</a></li>
            {% endif %}
          </ul>
        </li>

        <!-- Próximos: Compras, Categorías, Auditoría -->
      </ul>

      <div class="d-flex align-items-center gap-2">
        <span class="text-white-50 small">
          {{ user.name }} ({{ user.role }})
        </span>
        <form method="post" action="/logout" class="m-0">
          <button class="btn btn-sm btn-warning">Salir</button>
        </form>
      </div>

      {% else %}
      <div class="ms-auto">
        <a class="btn btn-sm btn-outline-light" href="/login">Login</a>
      </div>
      {% endif %}
    </div>
  </div>
</nav>

<main class="container py-4">
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function setPriceFromSelected() {
    const sel = document.getElementById("add_product_id");
    const priceInput = document.getElementById("add_price");
    if (!sel || !priceInput) return;

    const opt = sel.options[sel.selectedIndex];
    const price = opt?.dataset?.price ?? "0";
    priceInput.value = price;
  }

  function updatePreviewTotal() {
    const qty = parseInt(document.getElementById("add_qty")?.value || "0", 10);
    const price = parseInt(document.getElementById("add_price")?.value || "0", 10);
    const disc = parseInt(document.getElementById("add_discount")?.value || "0", 10);
    const total = Math.max((qty * price) - disc, 0);
    const el = document.getElementById("add_preview_total");
    if (el) el.textContent = total ? total.toLocaleString("es-CO") : "—";
  }

  // Delegación: funciona aunque HTMX re-renderice la tabla
  document.addEventListener("change", (e) => {
    if (e.target && e.target.id === "add_product_id") {
      setPriceFromSelected();
      updatePreviewTotal();
    }
  });

  document.addEventListener("input", (e) => {
    if (["add_qty", "add_price", "add_discount"].includes(e.target?.id)) {
      updatePreviewTotal();
    }
  });

  document.addEventListener("DOMContentLoaded", () => {
    setPriceFromSelected();
    updatePreviewTotal();
  });

  document.body.addEventListener("htmx:afterSwap", () => {
    setPriceFromSelected();
    updatePreviewTotal();
  });
</script>

</body>
</html>
