{% extends "partials/base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Ajuste de Stock (+/-)</h2>
  <a class="btn btn-outline-secondary" href="/inventory/stock">Volver</a>
</div>

{% if error %}
<div class="alert alert-danger">{{ error }}</div>
{% endif %}
{% if ok %}
<div class="alert alert-success">{{ ok }}</div>
{% endif %}

<form method="post" action="/inventory/adjust" class="row g-3">
  <div class="col-md-8">
    <label class="form-label">Producto</label>
    <select name="product_id" class="form-select" required>
      {% for p in products %}
        <option value="{{ p.id }}">{{ p.sku }} - {{ p.name }} (stock {{ p.current_stock }})</option>
      {% endfor %}
    </select>
  </div>

  <div class="col-md-4">
    <label class="form-label">Cantidad (usa negativo para restar)</label>
    <input name="qty" type="number" class="form-control" placeholder="Ej: 5 o -2" required>
  </div>

  <div class="col-12">
    <label class="form-label">Nota</label>
    <input name="note" class="form-control" placeholder="Motivo del ajuste (opcional)">
  </div>

  <div class="col-12">
    <button class="btn btn-primary">Aplicar ajuste</button>
  </div>
</form>
{% endblock %}
